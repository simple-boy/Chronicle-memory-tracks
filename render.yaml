# Optional Blueprint. Creates TWO paid services and disks; review costs before using.
services:
  - type: web
    name: chronicle-code
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: "off"
    disk:
      name: code-memory
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MEMORY_TRACK
        value: coding
      - key: MEMORY_DB_PATH
        value: /app/data/coding.sqlite3
      - key: MODEL_PROVIDER
        value: openai
      - key: ADD_MODEL
        value: gpt-4o-mini
      - key: PRODUCTION
        value: "1"
      - key: MEMORY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: chronicle-vision
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: "off"
    disk:
      name: vision-memory
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MEMORY_TRACK
        value: multimodal
      - key: MEMORY_DB_PATH
        value: /app/data/multimodal.sqlite3
      - key: MODEL_PROVIDER
        value: openai
      - key: ADD_MODEL
        value: gpt-4o-mini
      - key: VISION_DETAIL
        value: high
      - key: PRODUCTION
        value: "1"
      - key: MEMORY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
